<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Invoice PDF Test</title>
    <style>
        @page {
            size: A4;
            margin: 1.5cm;
        }
        body {
            font-family: Arial, sans-serif;
            color: #333333;
            font-size: 12pt;
        }
        h1 {
            color: #1a365d;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #edf2f7;
        }
        .total-row {
            font-weight: bold;
            background-color: #f7fafc;
        }
    </style>
</head>
<body>
    <h1>Invoice PDF Test</h1>

    <p><strong>Customer:</strong> {{ customer_name|default:"Test Customer" }}</p>

    <table>
        <tr>
            <th>Description</th>
            <th>Amount</th>
        </tr>
        <tr>
            <td>Subtotal</td>
            <td>&#8377;{{ subtotal|default:"1000.00" }}</td>
        </tr>
        <tr>
            <td>GST</td>
            <td>&#8377;{{ gst|default:"180.00" }}</td>
        </tr>
        <tr class="total-row">
            <td>Grand Total</td>
            <td>&#8377;{{ grand_total|default:"1180.00" }}</td>
        </tr>
    </table>
</body>
</html>
